<!doctype html>
<html lang="en" data-lvl="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Micro detail — prototype</title>
<style>
@font-face{font-family:"Nuckle";src:url(/fonts/nuckle-medium.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Riccione";src:url(/fonts/riccione-light.woff2) format("woff2");font-weight:300;font-display:swap}
:root{--cream:#f1eee7;--ink:#0b0b0b;--mute:#8e8b86;--m:20px;--g:20px;--sm:11px;--line:1px solid var(--ink)}
*{box-sizing:border-box;margin:0}
html{background:var(--cream)}
body{background:var(--cream);color:var(--ink);font:500 15px/1.4 "Nuckle",system-ui,sans-serif;letter-spacing:-.03em;padding-bottom:140px;-webkit-font-smoothing:antialiased}
img{display:block;width:100%;height:100%;object-fit:cover}
.num{font-variant-numeric:tabular-nums;letter-spacing:0}

/* level switch (prototype only) */
.sw{position:sticky;top:0;z-index:20;display:flex;gap:6px;padding:10px var(--m);background:var(--cream);border-bottom:var(--line);font-size:var(--sm);align-items:center}
.sw span{margin-right:auto;color:var(--mute)}
.sw button{font:inherit;border:var(--line);background:none;border-radius:99px;padding:5px 12px;cursor:pointer;color:var(--ink)}
.sw button[aria-pressed=true]{background:var(--ink);color:var(--cream)}

/* page */
.hero{padding:60px var(--m) 40px;font-size:clamp(28px,4.2vw,64px);line-height:1.02;letter-spacing:-.045em;max-width:16em;position:relative}
.st{position:relative;display:flex;align-items:baseline;gap:12px;padding:14px var(--m) 12px;border-bottom:var(--line);border-top:var(--line);font-size:var(--sm)}
.st .tt{font-size:var(--sm)}
.st .meta{margin-left:auto;color:var(--mute);display:none}
.grid{display:grid;grid-template-columns:1fr 1fr;position:relative}
.wk{position:relative;padding:var(--g) var(--m) 22px;border-bottom:var(--line)}
.wk:nth-child(odd){border-right:var(--line)}
.wk .im{position:relative;display:block;aspect-ratio:4/3;overflow:hidden;background:#e4e0d6}
.wk h3{font-size:20px;letter-spacing:-.035em;margin-top:14px;font-weight:500}
.wk p{color:var(--mute);font-size:14px;margin-top:2px}
.idx,.code,.spec,.tick,.reg,.coord,.led,.rule,.screw{display:none}

/* ——— L1: index numbers, corner ticks on images, pressed buttons, active-dot on nav ——— */
.idx{position:absolute;top:calc(var(--g) + 8px);left:calc(var(--m) + 8px);z-index:2;font-size:10px;color:var(--ink);background:var(--cream);padding:2px 5px 1px}
[data-lvl="1"] .idx,[data-lvl="2"] .idx,[data-lvl="3"] .idx{display:block}
.tick{position:absolute;width:9px;height:9px;border:0 solid var(--ink);z-index:2}
.tick.tl{top:-5px;left:-5px;border-top-width:1px;border-left-width:1px}
.tick.tr{top:-5px;right:-5px;border-top-width:1px;border-right-width:1px}
.tick.bl{bottom:-5px;left:-5px;border-bottom-width:1px;border-left-width:1px}
.tick.br{bottom:-5px;right:-5px;border-bottom-width:1px;border-right-width:1px}
.wk .fr{position:relative}
[data-lvl="1"] .tick,[data-lvl="2"] .tick,[data-lvl="3"] .tick{display:block}

/* ——— L2: spec row, section ruler, registration crosses at grid joins, count ——— */
.spec{margin-top:10px;font-size:10px;color:var(--mute);gap:0;flex-wrap:wrap}
.spec i{font-style:normal;padding:0 8px;border-left:1px solid rgba(11,11,11,.25)}
.spec i:first-child{padding-left:0;border-left:0}
[data-lvl="2"] .spec,[data-lvl="3"] .spec{display:flex}
[data-lvl="2"] .st .meta,[data-lvl="3"] .st .meta{display:block}
.rule{position:absolute;left:var(--m);right:var(--m);bottom:-1px;height:6px;background:repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 8px);mask:linear-gradient(#000,#000)}
.rule::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 64px);transform:scaleY(1.8);transform-origin:bottom}
[data-lvl="2"] .rule,[data-lvl="3"] .rule{display:block}
.reg{position:absolute;width:13px;height:13px;z-index:3;transform:translate(-50%,-50%);background:linear-gradient(var(--ink),var(--ink)) center/1px 100% no-repeat,linear-gradient(var(--ink),var(--ink)) center/100% 1px no-repeat}
.reg::after{content:"";position:absolute;inset:3px;border:1px solid var(--ink);border-radius:50%;background:var(--cream);display:none}
[data-lvl="2"] .reg,[data-lvl="3"] .reg{display:block}

/* ——— L3: part codes, corner coordinates, live clock + LED in the notch, screw heads in the footer ——— */
.code{position:absolute;right:var(--m);top:calc(var(--g) - 15px);font-size:9px;color:var(--mute);letter-spacing:.04em}
[data-lvl="3"] .code{display:block}
[data-lvl="3"] .reg::after{display:block}
.coord{position:absolute;font-size:9px;color:var(--mute);letter-spacing:.04em}
[data-lvl="3"] .coord{display:block}

/* notch (bottom bar) */
.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:30;width:min(520px,calc(100% - 2*var(--m)));height:48px;background:var(--cream);border:var(--line);border-bottom:0;border-radius:14px 14px 0 0;display:flex;align-items:center;justify-content:center;gap:28px;font-size:15px}
.nb{position:relative;color:var(--mute);text-decoration:none;padding:6px 4px;transition:color .3s,transform .1s ease-out}
.nb.on{color:var(--ink)}
.nb:active{transform:scale(.96)}
.nb.on::after{content:"";position:absolute;left:50%;bottom:-2px;width:4px;height:4px;border-radius:50%;background:var(--ink);transform:translateX(-50%);opacity:0}
[data-lvl="1"] .nb.on::after,[data-lvl="2"] .nb.on::after,[data-lvl="3"] .nb.on::after{opacity:1}
[data-lvl="2"] .nav,[data-lvl="3"] .nav{box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(11,11,11,.06);background:linear-gradient(#f4f1ea,#ece8df)}
.led{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:9px;color:var(--mute);align-items:center;gap:6px;letter-spacing:.04em}
.led b{width:6px;height:6px;border-radius:50%;background:#c6ff3d;box-shadow:0 0 0 1px rgba(11,11,11,.5),0 0 6px #c6ff3d}
.clk{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:9px;color:var(--mute);letter-spacing:.04em;display:none}
[data-lvl="3"] .led{display:flex}[data-lvl="3"] .clk{display:block}

.foot{position:relative;margin:60px var(--m) 0;border:var(--line);padding:28px 24px;display:grid;grid-template-columns:1fr 1fr;gap:20px;font-size:var(--sm)}
.foot h4{font-weight:500;font-size:var(--sm);color:var(--mute);margin-bottom:4px}
.screw{position:absolute;width:9px;height:9px;border-radius:50%;border:1px solid var(--ink);background:linear-gradient(45deg,transparent 45%,var(--ink) 45% 55%,transparent 55%)}
[data-lvl="3"] .screw{display:block}

@media (max-width:640px){
  .grid{grid-template-columns:1fr}
  .wk:nth-child(odd){border-right:0}
  .reg.mid{display:none!important}
  .nav{gap:22px}
  .led span,.clk{font-size:9px}
}
</style>
</head>
<body>

<div class="sw" role="group" aria-label="Detail level">
  <span>Micro detail</span>
  <button data-l="0">Off</button><button data-l="1">Light</button><button data-l="2">Medium</button><button data-l="3">Heavy</button>
</div>

<header class="hero">Where craft and AI blend. Ideas made by hand, then built to keep on working.
  <span class="coord" style="left:var(--m);top:24px">AJ — 2026 — UK</span>
</header>

<div class="st"><span class="tt">Case Studies</span><span class="meta num">09 projects</span><span class="rule"></span></div>

<div class="grid" id="grid"></div>

<footer class="foot">
  <i class="screw" style="left:8px;top:8px"></i><i class="screw" style="right:8px;top:8px"></i><i class="screw" style="left:8px;bottom:8px"></i><i class="screw" style="right:8px;bottom:8px"></i>
  <div><h4>Studio</h4><p>Based in the UK</p><p><span class="num" id="ft">--:--</span> here right now</p></div>
  <div><h4>Say hello</h4><p>letschat@joecallingham.com</p></div>
</footer>

<nav class="nav" aria-label="Main">
  <span class="led"><b></b><span>OPEN</span></span>
  <a class="nb" href="#">Work</a><a class="nb on" href="#">Book call</a><a class="nb" href="#">Info</a>
  <span class="clk num" id="ck">UK --:--</span>
</nav>

<script>
const W = [
  ['Bison Coffee','Bringing quality to a traditional scene','/img/work/bison/cup.jpg','Branding|Packaging|Art Direction'],
  ['620 Tennis Multicamp','More time coaching, less time promoting','/img/620-clean.jpg','Branding|Automation|Photography'],
  ['Brewed by Boon','Crafted by hand, rolled out weekly by AI','/img/boon-sign.jpg','Branding|Automation|App Build'],
  ['The Hunna','Back from a hiatus on their own terms','/img/the-hunna-hero.jpg','Tour Artwork|Campaign|Merch'],
];
const g = document.getElementById('grid'), pad = n => String(n).padStart(2,'0');
g.innerHTML = W.map(([n,l,src,c],i) => `
  <article class="wk">
    <span class="code">AJ–WK–${pad(i+1)}</span>
    <div class="fr"><span class="im"><img src="${src}" alt="" loading="lazy"></span>
      <i class="tick tl"></i><i class="tick tr"></i><i class="tick bl"></i><i class="tick br"></i></div>
    <span class="idx num">${pad(i+1)} / 09</span>
    <h3>${n}</h3><p>${l}</p>
    <div class="spec">${c.split('|').map(x=>`<i>${x}</i>`).join('')}</div>
  </article>`).join('');
// registration crosses where the grid lines meet (desktop: centre column joins)
const regs = () => { g.querySelectorAll('.reg').forEach(r=>r.remove());
  const cards=[...g.children], two=innerWidth>640;
  cards.forEach((c,i)=>{ if(two && i%2) return; const r=document.createElement('i'); r.className='reg'+(two?' mid':'');
    r.style.left=(two?c.offsetWidth:24)+'px'; r.style.top=(c.offsetTop+c.offsetHeight)+'px'; g.appendChild(r); }); };
regs(); addEventListener('resize', regs); addEventListener('load', regs); g.querySelectorAll('img').forEach(i=>i.addEventListener('load', regs));
// level switch
const set = l => { document.documentElement.dataset.lvl = l; document.querySelectorAll('.sw button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.l==l)); try{localStorage.mlvl=l}catch(e){} };
document.querySelectorAll('.sw button').forEach(b=>b.onclick=()=>set(b.dataset.l));
let s='1'; try{s=localStorage.mlvl||'1'}catch(e){} set(s);
// UK time
const tick = () => { const t=new Date().toLocaleTimeString('en-GB',{timeZone:'Europe/London',hour:'2-digit',minute:'2-digit'}); ft.textContent=t; ck.textContent='UK '+t; };
tick(); setInterval(tick, 20000);
</script>
</body>
</html>
